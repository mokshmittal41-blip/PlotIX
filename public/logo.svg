<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pw-svg-em" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34D399" />
      <stop offset="50%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#047857" />
    </linearGradient>
    <linearGradient id="pw-svg-bl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#60A5FA" />
      <stop offset="100%" stopColor="#1D4ED8" />
    </linearGradient>
    <linearGradient id="pw-svg-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FCD34D" />
      <stop offset="100%" stopColor="#F59E0B" />
    </linearGradient>
    <filter id="pw-svg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Geometric Emblem -->
  <g transform="translate(6, 6) scale(0.48)">
    <polygon points="50,4 90,26 90,74 50,96 10,74 10,26" fill="url(#pw-svg-em)" />
    <polygon points="50,4 90,26 90,74 50,50" fill="url(#pw-svg-bl)" opacity="0.88" />
    <polygon points="50,4 10,26 10,74 50,50" fill="#FFFFFF" opacity="0.25" />
    <polygon points="10,74 50,50 90,74 50,96" fill="#0B1726" opacity="0.55" />
    
    <polygon points="50,22 72,35 50,48 28,35" fill="#FFFFFF" opacity="0.85" stroke="#FFFFFF" stroke-width="1.5" />
    <polygon points="28,35 50,48 50,76 28,63" fill="url(#pw-svg-em)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <polygon points="50,48 72,35 72,63 50,76" fill="url(#pw-svg-bl)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="50" y1="48" x2="50" y2="76" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    
    <g filter="url(#pw-svg-glow)">
      <circle cx="50" cy="35" r="4.5" fill="url(#pw-svg-gold)" />
      <polygon points="50,27 52.5,35 60,35 53.5,37.5 56,45 50,39.5 44,45 46.5,37.5 40,35 47.5,35" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="64" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#0B1420" letter-spacing="-0.04em">Prop<tspan fill="#10B981">Wise</tspan></text>
  
  <!-- PRO Badge -->
  <rect x="170" y="16" width="36" height="18" rx="5" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
  <text x="178" y="29" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#059669" letter-spacing="0.08em">PRO</text>
  
  <!-- Subtitle -->
  <text x="64" y="47" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#64748B" letter-spacing="0.12em">REAL ESTATE INTELLIGENCE</text>
</svg>

